[package]
name = "rustler_beam_test"
description = "Write the tests of a Rustler NIF library in Rust and run them inside a real BEAM"
repository = "https://github.com/rusterlium/rustler"
version = "0.39.0"
license = "MIT/Apache-2.0"
readme = "README.md"
edition = "2021"
rust-version = "1.91"

[dependencies]
# The library picks its NIF version, and 2.15 is the lowest that rustler builds
# with.
rustler = { path = "../rustler", version = "0.39.0", default-features = false, features = ["nif_manifest", "nif_version_2_15"] }
rustler_beam_test_macros = { path = "macros", version = "0.39.0" }
